name: Verify quantum challenge
on: [push, pull_request]
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[hardware,dev]'
      - run: python scripts/run_tests.py
      - run: python -m minesweeper simulate --shots 512 --seed 2026
      - uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: results/
